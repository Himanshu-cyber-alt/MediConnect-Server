name: Pipeline For Mediconnect Backend

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get code from repo
        uses: actions/checkout@v4

      - name: Connect to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Login to AWS ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t mediconnect-server-img .

      - name: Tag Docker image
        run: |
          docker tag mediconnect-server-img:latest 541739391357.dkr.ecr.ap-south-1.amazonaws.com/mediconnect-server-image:latest

      - name: Push image to ECR
        run: |
          docker push 541739391357.dkr.ecr.ap-south-1.amazonaws.com/mediconnect-server-image:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ap-south-1 | sudo docker login --username AWS --password-stdin 541739391357.dkr.ecr.ap-south-1.amazonaws.com

            sudo docker pull 541739391357.dkr.ecr.ap-south-1.amazonaws.com/mediconnect-server-image:latest

            sudo docker stop mediconnect-container || true
            sudo docker rm mediconnect-container || true

            sudo docker run -d \
              --name mediconnect-container \
              --env-file /home/ec2-user/MediConnect-Server/.env \
              -p 5000:5000 \
              541739391357.dkr.ecr.ap-south-1.amazonaws.com/mediconnect-server-image:latest



